<div class="login-wrapper py-5">
    <div class="login-container mx-auto">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-compass"></i> TripSavvy
            </div>
            <h2>Welcome Back</h2>
            <p>Log in to manage your itineraries and explore hidden gems.</p>
        </div>
        
        <form id="loginForm" ng-submit="submitLogin($event)" novalidate>
            <!-- Email Input Group -->
            <div class="input-group" id="emailGroup">
                <input type="email" id="email" ng-model="email" required placeholder=" " />
                <label for="email">Email Address</label>
                <span class="error" ng-show="emailError">{{emailError}}</span>
            </div>
            <button type="button" class="btn-next" ng-show="showNextBtn" ng-click="clickNext()">Next</button>
            
            <!-- Password Input Group (Hidden initially) -->
            <div class="input-group" id="passwordGroup" ng-show="showPasswordGroup">
                <input type="password" id="password" ng-model="password" required placeholder=" " />
                <label for="password">Password</label>
                <span class="error" ng-show="passwordError">{{passwordError}}</span>
            </div>
            <button type="submit" class="btn-submit" ng-show="showSubmitBtn">Submit</button>
        </form>
        
        <div class="login-redirect">
            <p>New user? <a href="#!/signup">Create an Account</a></p>
        </div>
    </div>
</div>
